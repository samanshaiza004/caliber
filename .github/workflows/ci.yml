name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  msrv:
    name: minimum Rust version (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked

  fresh-consumer:
    name: fresh consumer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up MSVC compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build Caliber CLI
        run: cargo build -p caliber
      - name: Resolve and test a fresh pinned consumer
        run: python tools/ci/fresh_consumer.py

  rust:
    name: rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/ci-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Test workspace with a fresh target directory
        shell: bash
        run: |
          test ! -e "$CARGO_TARGET_DIR"
          cargo build -p caliber-ffi --locked
          cargo test --workspace --locked
      - name: Check ABI library selection and override
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Windows) library=caliber_ffi.dll ;;
            macOS) library=libcaliber_ffi.dylib ;;
            *) library=libcaliber_ffi.so ;;
          esac

          # A stale profile-level artifact must not mask the test dependency.
          printf 'stale profile library\n' > "$CARGO_TARGET_DIR/debug/$library"
          cargo test --locked -p caliber-abi-tests --test abi_compat
          rm "$CARGO_TARGET_DIR/debug/$library"

          # Verify that a valid override loads, and a missing one fails instead
          # of falling back to the dependency cdylib.
          cp "$CARGO_TARGET_DIR/debug/deps/$library" "$CARGO_TARGET_DIR/override-$library"
          CALIBER_FFI_PATH="$CARGO_TARGET_DIR/override-$library" \
            cargo test --locked -p caliber-abi-tests --test abi_compat v1_client_loads_current_library
          missing="$CARGO_TARGET_DIR/missing-$library"
          for client in current_v1_client_loads_current_library frozen_old_v1_client_loads_current_library; do
            if CALIBER_FFI_PATH="$missing" cargo test --locked -p caliber-abi-tests \
                --test abi_compat "$client" -- --exact > "$CARGO_TARGET_DIR/override-check.log" 2>&1; then
              echo "$client unexpectedly accepted a missing CALIBER_FFI_PATH"
              exit 1
            fi
            if ! grep -F "Caliber cdylib missing at $missing" "$CARGO_TARGET_DIR/override-check.log"; then
              cat "$CARGO_TARGET_DIR/override-check.log"
              exit 1
            fi
          done
      - name: Test ABI clients with a custom profile and explicit target
        shell: bash
        run: |
          host_target=$(rustc -vV | sed -n 's/^host: //p' | tr -d '\r')
          cargo --config 'profile.abi-ci.inherits="dev"' build --locked \
            -p caliber-ffi --profile abi-ci --target "$host_target"
          cargo --config 'profile.abi-ci.inherits="dev"' test --locked \
            -p caliber-abi-tests --test abi_compat --profile abi-ci --target "$host_target"
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path experiments/synthetic-rust/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path experiments/synthetic-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --manifest-path experiments/synthetic-rust/Cargo.toml
      - run: cargo build --manifest-path experiments/synthetic-rust/Cargo.toml

  experiments:
    name: experiments (unix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cargo run --manifest-path experiments/synthetic-rust/Cargo.toml
      - run: python3 experiments/synthetic/trace_harness.py
      - run: cargo build -p caliber-ffi
      - name: Run canonical C lifecycle example
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.dylib" ;;
            *) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.so" ;;
          esac
          output="$RUNNER_TEMP/caliber-c-lifecycle"
          if [ "$RUNNER_OS" = Linux ]; then
            cc -std=c11 -Wall -Wextra -Werror -pthread -I include \
              examples/c-counter/lifecycle.c -ldl -o "$output"
          else
            cc -std=c11 -Wall -Wextra -Werror -pthread -I include \
              examples/c-counter/lifecycle.c -o "$output"
          fi
          "$output" "$library"
      - name: Run illustrative Python ctypes consumer
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.dylib" ;;
            *) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.so" ;;
          esac
          python3 examples/python-ctypes/lifecycle.py "$library"
      - name: Run Go cgo smoke
        working-directory: experiments/go-ffi
        shell: bash
        run: |
          CGO_LDFLAGS="-L${GITHUB_WORKSPACE}/target/debug" \
          LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/debug" \
          DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/debug" \
          go run .
