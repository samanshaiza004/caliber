name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: rust quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path experiments/synthetic-rust/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --manifest-path experiments/synthetic-rust/Cargo.toml --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace
      - run: cargo test --manifest-path experiments/synthetic-rust/Cargo.toml
      - run: cargo build --manifest-path experiments/synthetic-rust/Cargo.toml

  experiments:
    name: experiments (unix)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cargo run --manifest-path experiments/synthetic-rust/Cargo.toml
      - run: python3 experiments/synthetic/trace_harness.py
      - run: cargo build -p caliber-ffi
      - name: Run canonical C lifecycle example
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.dylib" ;;
            *) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.so" ;;
          esac
          output="$RUNNER_TEMP/caliber-c-lifecycle"
          if [ "$RUNNER_OS" = Linux ]; then
            cc -std=c11 -Wall -Wextra -Werror -pthread -I include \
              examples/c-counter/lifecycle.c -ldl -o "$output"
          else
            cc -std=c11 -Wall -Wextra -Werror -pthread -I include \
              examples/c-counter/lifecycle.c -o "$output"
          fi
          "$output" "$library"
      - name: Run illustrative Python ctypes consumer
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.dylib" ;;
            *) library="$GITHUB_WORKSPACE/target/debug/libcaliber_ffi.so" ;;
          esac
          python3 examples/python-ctypes/lifecycle.py "$library"
      - name: Run Go cgo smoke
        working-directory: experiments/go-ffi
        shell: bash
        run: |
          CGO_LDFLAGS="-L${GITHUB_WORKSPACE}/target/debug" \
          LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/debug" \
          DYLD_LIBRARY_PATH="${GITHUB_WORKSPACE}/target/debug" \
          go run .
