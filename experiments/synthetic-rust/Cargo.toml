[package]
name = "caliber-synthetic-rust"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
description = "Private Rust falsification harness for the Caliber boundary"

[workspace]

[dependencies]
caliber-core = { path = "../../crates/caliber-core" }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0", features = ["derive"] }
